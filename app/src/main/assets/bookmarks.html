<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookmarks</title>
<style>
  :root { --bg:#070a14; --card:#121829; --line:#24304d; --text:#e8ecf6; --dim:#8a96b3; --accent:#5b8cff; --danger:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,Roboto,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; padding:44px 48px 80px; }
  header { width:min(1000px,100%); display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  header svg { width:30px; height:30px; fill:var(--accent); flex:none; }
  h1 { font-weight:600; font-size:28px; margin:0; flex:1; }
  .stat { color:var(--dim); font-size:14px; }
  .stat b { color:var(--accent); font-weight:600; }
  form { display:flex; width:min(1000px,100%); gap:10px; margin-bottom:30px; }
  input { flex:1; font-size:20px; padding:14px 18px; border-radius:12px; border:2px solid var(--line);
    background:var(--card); color:var(--text); outline:none; }
  input:focus { border-color:var(--accent); }
  button.go { font-size:18px; padding:0 26px; border-radius:12px; border:0; background:var(--accent); color:#fff; }
  #grid { width:min(1000px,100%); display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .bm { position:relative; border-radius:14px; background:var(--card); border:2px solid var(--line); }
  .bm:hover { border-color:var(--accent); }
  .bm a { display:flex; gap:12px; align-items:center; padding:16px 44px 16px 16px; color:var(--text); text-decoration:none; }
  .bm img { width:32px; height:32px; border-radius:8px; background:#1d2540; flex:none; }
  .bm .t { min-width:0; }
  .bm b { display:block; font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bm span { display:block; font-size:12px; color:var(--dim); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bm .x { position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:15px; border:0;
    background:transparent; color:var(--dim); font-size:20px; line-height:30px; padding:0; }
  .bm .x:hover { background:var(--danger); color:#fff; }
  .empty { color:var(--dim); font-size:16px; line-height:1.7; grid-column:1/-1; }
  kbd { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:2px 7px; color:var(--text); }
  .keys { position:fixed; bottom:18px; left:0; right:0; text-align:center; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
  <header>
    <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
    <h1>Bookmarks</h1>
    <div class="stat"><b id="stat">0</b> ads &amp; pop-ups blocked</div>
  </header>
  <form id="f">
    <input id="q" placeholder="Search Google or type a web address" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="go">Go</button>
  </form>
  <div id="grid"><div class="empty">No bookmarks yet. On any page, hold <kbd>OK</kbd> (or press <kbd>Menu</kbd>) and pick ★ to save it here.</div></div>
  <div class="keys">Arrows move the pointer · <kbd>OK</kbd> open · <kbd>×</kbd> remove · hold <kbd>OK</kbd> toolbar · <kbd>Back</kbd> go back</div>
<script>
  document.getElementById('f').onsubmit = function (e) {
    e.preventDefault();
    var v = document.getElementById('q').value.trim();
    if (!v) return;
    if (!/^[a-z]+:\/\//i.test(v)) v = (/^[^\s]+\.[^\s]{2,}$/.test(v) ? 'https://' + v : 'https://www.google.com/search?q=' + encodeURIComponent(v));
    location.href = v;
  };
  // Called by MainActivity once the page has loaded, and again after a removal.
  function render(data) {
    document.getElementById('stat').textContent = data.blocked.toLocaleString();
    var g = document.getElementById('grid');
    if (!data.bookmarks.length) return;
    g.innerHTML = '';
    data.bookmarks.forEach(function (b) {
      var card = document.createElement('div'); card.className = 'bm';
      var a = document.createElement('a'); a.href = b.u;
      var host = b.u.replace(/^https?:\/\/(www\.)?/, '').split('/')[0];
      var img = document.createElement('img'); img.alt = '';
      img.src = 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(host);
      var t = document.createElement('div'); t.className = 't';
      var bt = document.createElement('b'); bt.textContent = b.t;
      var u = document.createElement('span'); u.textContent = b.u.replace(/^https?:\/\/(www\.)?/, '');
      t.appendChild(bt); t.appendChild(u); a.appendChild(img); a.appendChild(t);
      var x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.title = 'Remove';
      x.onclick = function () { ClearBridge.removeBookmark(b.u); };
      card.appendChild(a); card.appendChild(x); g.appendChild(card);
    });
  }
</script>
</body>
</html>
